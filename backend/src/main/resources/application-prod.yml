spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  devtools:
    restart:
      enabled: false

logging:
  level:
    com.eventmanagement: INFO
    org.springframework.security: WARN

jwt:
  secret: ${JWT_SECRET}
