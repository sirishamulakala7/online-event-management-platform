spring:
  datasource:
    url: jdbc:mysql://localhost:3306/event_management_dev?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  devtools:
    restart:
      enabled: true

logging:
  level:
    com.eventmanagement: DEBUG
    org.springframework.security: DEBUG
